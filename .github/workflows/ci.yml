name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++-13, name: linux-gcc13 }
          - { os: ubuntu-24.04, cxx: g++-14, name: linux-gcc14 }
          - { os: ubuntu-24.04, cxx: clang++-18, name: linux-clang18 }
          - { os: ubuntu-24.04, cxx: g++-14, name: linux-gcc14-poll, flags: "-DSTDNET_FORCE_POLL" }
          - { os: macos-15, cxx: clang++, name: macos-clang }
          - { os: windows-2025, cxx: cl, name: windows-msvc }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cxx }}" = "cl" ]; then
            cmake -S . -B build
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          fi
      - name: Build
        run: cmake --build build --config Debug -j 4
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure

  bench-smoke:
    # Functional check of the benchmark suite; CI runners are too noisy for absolute numbers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DSTDNET_BUILD_BENCH=ON -DSTDNET_BUILD_TESTS=OFF -DSTDNET_BUILD_EXAMPLES=OFF
      - run: cmake --build build-bench -j 4
      - run: python3 bench/run.py --build build-bench/bench --out bench-smoke --reps 1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-smoke
          path: bench-smoke/results.json
